<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Car Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="container">
    <header>
      <h1>Book a Car</h1>
    </header>
    <main>
      <section id="form">
        <h2>Contact Us</h2>

        <form action="process.html" method="get" id="booking">
          <div class="form-row">
            <label for="contactname">Name</label>
            <input type="text" name="contactname" id="contactname" autofocus required
              pattern="[A-Z][a-z]+( [A-Z][a-z]+)*"
              title="Please enter your first and last name, starting with capital letters.">
          </div>


          <div class="form-row">

            <label for="contactemail">Email Address</label>
            <input type="email" name="contactemail" id="contactemail" required
              pattern="[a-z0-9._%+-]+@[a-z0-9.-]+.[a-z]{2,}$""
            title=" Please enter a valid email address.">
          </div>



          <div class="form-row">
            <label>Do you have a Driver's Licence?</label>
            <div class="radio-group">
              <label for="licenseYes"><input type="radio" name="license" id="licenseYes" value="yes" checked="checked">
                Yes</label>
              <label for="licenseNo"><input type="radio" name="license" id="licenseNo" value="no"> No</label>
            </div>
          </div>
          <br>

          <div class="form-row">
            <label for="age">Age</label>
            <input type="number" name="age" id="age" min="17" max="80" required
              title="Please enter your age (between 17 and 80).">

          </div>

          <div class="form-row">
            <label for="booking_date">Booking Date</label>
            <input type="date" name="booking_date" id="booking_date" required title="Please select a booking date.">
          </div>

          <div class="form-row">
            <label for="car">Car</label>
            <select name="car" id="car">
              <option value="ford-focus">Ford Focus</option>
              <option value="hyundai-tucson">Hyundai Tucson</option>
              <option value="toyota-rav4">Toyota Rav4</option>
              <option value="renault-kadjar">Renault Kadjar</option>
              <option value="nissan-qashqai">Nissan Qashqai</option>
            </select>
          </div>

          <p><strong>Please provide us with any other details you think will be useful to us in the text area below
              (it may save us calling or emailing you, and help avoid delays).</strong></p><br>


          <div class="form-row">
            <label for="comments">More details (as much as you think we'll need!)</label>
            <textarea id="comments" name="comments" rows="5" cols="40" maxlength="800"></textarea>


          </div>

          <div class="button-group">
            <button type="submit">Send Us the Info</button>
            <button type="reset">Clear the Info</button>
          </div>

        </form>
      </section>
      <section id="image">
        <figure>
          <img src="images/car.jfif" alt="Car" class="ui fluid image">
          <figcaption>Car Rental</figcaption>
        </figure>
      </section>
    </main>
  </div>
</body>

</html>
